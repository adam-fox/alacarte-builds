name: Build alacarte images

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out upstream alacarte
        uses: actions/checkout@v4
        with:
          repository: norifm/alacarte
          ref: main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push alacarte-wrapper
        uses: docker/build-push-action@v6
        with:
          context: ./wrapper
          platforms: linux/amd64
          push: true
          tags: ghcr.io/adam-fox/alacarte-wrapper:latest
          cache-from: type=gha,scope=alacarte-wrapper
          cache-to: type=gha,mode=max,scope=alacarte-wrapper

      - name: Build and push alacarte-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/adam-fox/alacarte-web:latest
          cache-from: type=gha,scope=alacarte-web
          cache-to: type=gha,mode=max,scope=alacarte-web
